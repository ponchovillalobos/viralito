[pytest]
# Acota la colección a python/tests/. Sin esto, `pytest` a secas recursa el runtime
# embebido (runtime/Lib/site-packages: torch/scipy/numba/sympy…) e intenta colectar
# ~150k tests de terceros → "Interrupted: N errors during collection". Con esto,
# `pytest` corre SOLO las suites del proyecto.
testpaths = tests
norecursedirs = runtime venv models __pycache__ .git node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
