# Compila el instalador de escritorio en un runner de GitHub.
#
# Por que existe: en maquinas Windows con Smart App Control activado, cargo no
# puede ejecutar los build scripts que el mismo compila (no estan firmados) y
# falla con "os error 4551". El runner de GitHub no tiene esa restriccion, asi
# que la compilacion vive aca y la maquina de desarrollo no necesita tocarse.
#
# Se dispara solo con un tag "v*" (publica un release) o a mano desde la pestana
# Actions (deja el instalador como artifact, sin publicar nada).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar un release ademas de dejar el artifact"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3.11 exacto: 3.12 rompe dependencias del pipeline (ver PREREQUISITES.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dependencias de frontend
        run: npm ci
        working-directory: frontend

      - name: Build del frontend (salida standalone)
        run: npm run build
        working-directory: frontend

      - name: Dependencias de remotion
        run: npm ci
        working-directory: remotion

      - name: Dependencias de desktop (CLI de Tauri)
        run: npm ci
        working-directory: desktop

      # bundle.ps1 busca ffmpeg en C:\viral-data\tools\ffmpeg-*. Se fija la serie
      # 8.x a proposito: FFmpeg 9 retiro -filter_complex_script y es una version
      # mayor sin probar contra este pipeline.
      - name: FFmpeg portable
        shell: pwsh
        run: |
          $dir = "C:\viral-data\tools"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = "$dir\ffmpeg.zip"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Remove-Item $zip
          Get-ChildItem $dir -Directory | Select-Object -ExpandProperty Name

      - name: Python portable (runtime embeddable)
        shell: pwsh
        working-directory: desktop
        run: ./make-python-runtime.ps1

      - name: Compilar el ejecutable de Tauri
        shell: pwsh
        working-directory: desktop
        run: npx tauri build --no-bundle

      - name: Armar el payload distribuible
        shell: pwsh
        working-directory: desktop
        run: ./bundle.ps1

      # NSIS y su plugin INetC, colocados en una carpeta ESCRIBIBLE del workspace.
      # El runner ya trae NSIS en Program Files, pero `build-installer.ps1` necesita
      # dejar INetC.dll dentro de su carpeta de plugins y ahí no siempre se puede
      # escribir. Preparándolo aquí, `Find-Makensis` lo encuentra por PATH y
      # `Ensure-Inetc` ve el plugin ya puesto, así que no descarga nada.
      - name: Preparar NSIS + plugin INetC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raiz = "$env:GITHUB_WORKSPACE\_nsis"
          New-Item -ItemType Directory -Force $raiz | Out-Null

          # Chocolatey viene en el runner y es más estable que SourceForge.
          choco install nsis --no-progress -y --version=3.10 | Out-Null
          $origen = Get-ChildItem "C:\Program Files (x86)\NSIS","C:\Program Files\NSIS" `
            -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $origen) { throw "no se encontro makensis tras instalar NSIS" }

          # Copia completa a un sitio donde SÍ se puede escribir el plugin.
          Copy-Item (Split-Path $origen.FullName) $raiz -Recurse -Force
          $makensis = Get-ChildItem $raiz -Filter makensis.exe -Recurse | Select-Object -First 1
          $nsisRoot = Split-Path $makensis.FullName
          if ((Split-Path $nsisRoot -Leaf) -eq 'Bin') { $nsisRoot = Split-Path $nsisRoot }

          # INetC, con reintentos: el wiki de NSIS falla a ratos.
          $zip = "$env:RUNNER_TEMP\Inetc.zip"
          $ok = $false
          foreach ($i in 1..3) {
            try {
              curl.exe -L -A 'Mozilla/5.0' --silent --show-error --fail `
                -o $zip 'https://nsis.sourceforge.io/mediawiki/images/c/c9/Inetc.zip'
              if ((Get-Item $zip -ErrorAction SilentlyContinue).Length -gt 10KB) { $ok = $true; break }
            } catch { Write-Host "intento $i fallido, reintentando..." }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "no se pudo bajar el plugin INetC tras 3 intentos" }

          $tmp = "$env:RUNNER_TEMP\_inetc"
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          foreach ($a in 'x86-unicode', 'x86-ansi') {
            $dst = Join-Path $nsisRoot "Plugins\$a"
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item (Join-Path $tmp "Plugins\$a\INetC.dll") $dst -Force
          }
          Write-Host "NSIS listo en $nsisRoot con INetC"
          "$(Split-Path $makensis.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # No bloquea el release: el Setup.exe es un DESCARGADOR de 1.8 MB que baja el
      # ZIP; el producto real es el ZIP portable. Si NSIS falla, la versión sale
      # igual con el ZIP y el instalador se añade cuando se arregle.
      - name: Compilar el instalador NSIS
        continue-on-error: true
        shell: pwsh
        working-directory: desktop
        run: ./build-installer.ps1 -OutDir "$env:GITHUB_WORKSPACE\dist" -ToolsDir "$env:GITHUB_WORKSPACE\_nsis"

      # El ZIP portable es la alternativa al instalador: se descomprime y corre,
      # sin escribir en Archivos de programa ni en el registro.
      - name: Empaquetar el ZIP portable
        shell: pwsh
        run: |
          $rel = "desktop\src-tauri\target\release"
          $stage = "$env:RUNNER_TEMP\portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$rel\*.exe" $stage -Force
          Copy-Item "$rel\payload" "$stage\payload" -Recurse -Force
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          $ver = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { "dev-$env:GITHUB_RUN_NUMBER" }
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\EstrategiaViralStudio-$ver.zip"
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Sumas SHA256
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -File |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Out-File "$env:GITHUB_WORKSPACE\dist\SHA256SUMS.txt" -Encoding utf8
          Get-Content "$env:GITHUB_WORKSPACE\dist\SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/
          retention-days: 14

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
