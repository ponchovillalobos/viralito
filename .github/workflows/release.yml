# Compila el instalador de escritorio en un runner de GitHub.
#
# Por que existe: en maquinas Windows con Smart App Control activado, cargo no
# puede ejecutar los build scripts que el mismo compila (no estan firmados) y
# falla con "os error 4551". El runner de GitHub no tiene esa restriccion, asi
# que la compilacion vive aca y la maquina de desarrollo no necesita tocarse.
#
# Se dispara solo con un tag "v*" (publica un release) o a mano desde la pestana
# Actions (deja el instalador como artifact, sin publicar nada).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar un release ademas de dejar el artifact"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3.11 exacto: 3.12 rompe dependencias del pipeline (ver PREREQUISITES.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dependencias de frontend
        run: npm ci
        working-directory: frontend

      - name: Build del frontend (salida standalone)
        run: npm run build
        working-directory: frontend

      - name: Dependencias de remotion
        run: npm ci
        working-directory: remotion

      - name: Dependencias de desktop (CLI de Tauri)
        run: npm ci
        working-directory: desktop

      # bundle.ps1 busca ffmpeg en C:\viral-data\tools\ffmpeg-*. Se fija la serie
      # 8.x a proposito: FFmpeg 9 retiro -filter_complex_script y es una version
      # mayor sin probar contra este pipeline.
      - name: FFmpeg portable
        shell: pwsh
        run: |
          $dir = "C:\viral-data\tools"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = "$dir\ffmpeg.zip"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Remove-Item $zip
          Get-ChildItem $dir -Directory | Select-Object -ExpandProperty Name

      - name: Python portable (runtime embeddable)
        shell: pwsh
        working-directory: desktop
        run: ./make-python-runtime.ps1

      - name: Compilar el ejecutable de Tauri
        shell: pwsh
        working-directory: desktop
        run: npx tauri build --no-bundle

      - name: Armar el payload distribuible
        shell: pwsh
        working-directory: desktop
        run: ./bundle.ps1

      # EL ZIP VA PRIMERO, A PROPÓSITO.
      # El Setup.exe no contiene la app: es un descargador de ~2 MB que baja este
      # mismo ZIP del release y lo verifica. O sea que el ZIP ES el producto y el
      # instalador es la comodidad. Empaquetarlo antes garantiza que una versión
      # siempre salga usable aunque NSIS falle — que es justo lo que pasó en el
      # primer intento, donde un fallo del instalador se llevó por delante todo
      # lo demás pese a haber compilado bien las 14 etapas anteriores.
      - name: Empaquetar el ZIP portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = "desktop\src-tauri\target\release"
          $stage = "$env:RUNNER_TEMP\portable"
          $dist = "$env:GITHUB_WORKSPACE\dist"
          New-Item -ItemType Directory -Force $stage, $dist | Out-Null

          Copy-Item "$rel\*.exe" $stage -Force
          Copy-Item "$rel\payload" "$stage\payload" -Recurse -Force
          $peso = (Get-ChildItem $stage -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("a empaquetar: {0:N1} GB" -f ($peso / 1GB))

          $ver = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { "dev-$env:GITHUB_RUN_NUMBER" }
          $salida = "$dist\EstrategiaViralStudio-$ver.zip"

          # 7-Zip, no Compress-Archive: el payload ronda los 5-7 GB y el cmdlet de
          # PowerShell se apoya en System.IO.Compression, que arrastra límites de
          # tamaño y se atraganta con árboles grandes. 7z viene en el runner.
          $7z = (Get-Command 7z -ErrorAction SilentlyContinue)?.Source
          if ($7z) {
            & $7z a -tzip -mx=5 -bso0 -bsp0 $salida "$stage\*"
            if ($LASTEXITCODE -ne 0) { throw "7z termino con codigo $LASTEXITCODE" }
          } else {
            Write-Host "7z no disponible, usando Compress-Archive"
            Compress-Archive -Path "$stage\*" -DestinationPath $salida
          }

          if (-not (Test-Path $salida)) { throw "no se genero $salida" }
          Write-Host ("ZIP: {0:N1} GB" -f ((Get-Item $salida).Length / 1GB))

      # A partir de aquí, TODO lo del instalador es opcional: si algo falla, la
      # versión sale igual con el ZIP de arriba. Las dos etapas llevan
      # `continue-on-error` porque el fallo puede caer en cualquiera de las dos.
      - name: Preparar NSIS + plugin INetC
        id: nsis
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # El runner ya trae NSIS, pero `build-installer.ps1` necesita dejar
          # INetC.dll dentro de su carpeta de plugins, y en Archivos de programa
          # no siempre se puede escribir. Se copia entero a un sitio escribible.
          $origen = Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' `
            -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $origen) { throw 'el runner no trae NSIS' }
          $nsisOrigen = Split-Path $origen.FullName
          if ((Split-Path $nsisOrigen -Leaf) -eq 'Bin') { $nsisOrigen = Split-Path $nsisOrigen }

          $destino = "$env:GITHUB_WORKSPACE\_nsis"
          Copy-Item $nsisOrigen $destino -Recurse -Force
          $makensis = (Get-ChildItem $destino -Filter makensis.exe -Recurse | Select-Object -First 1).FullName
          Write-Host "makensis copiado a $makensis"

          # INetC, con reintentos: el wiki de NSIS falla a ratos.
          $zip = "$env:RUNNER_TEMP\Inetc.zip"
          $bajado = $false
          foreach ($i in 1..3) {
            curl.exe -L -A 'Mozilla/5.0' --silent --show-error --fail -o $zip `
              'https://nsis.sourceforge.io/mediawiki/images/c/c9/Inetc.zip'
            if ((Test-Path $zip) -and (Get-Item $zip).Length -gt 10KB) { $bajado = $true; break }
            Write-Host "intento $i sin exito, reintentando..."
            Start-Sleep -Seconds 5
          }
          if (-not $bajado) { throw 'no se pudo bajar el plugin INetC' }

          $tmp = "$env:RUNNER_TEMP\_inetc"
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          foreach ($arq in 'x86-unicode', 'x86-ansi') {
            $dst = Join-Path (Split-Path $makensis) "..\Plugins\$arq"
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item (Join-Path $tmp "Plugins\$arq\INetC.dll") $dst -Force
          }
          Split-Path $makensis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host 'NSIS listo con INetC'

      # Se intenta aunque la preparación de NSIS haya ido regular: el propio
      # `build-installer.ps1` sabe buscar makensis por su cuenta y bajarse el
      # portable. Condicionarlo a que el paso anterior saliera perfecto solo
      # servía para saltárselo en silencio.
      - name: Compilar el instalador NSIS
        continue-on-error: true
        shell: pwsh
        working-directory: desktop
        run: ./build-installer.ps1 -OutDir "$env:GITHUB_WORKSPACE\dist" -ToolsDir "$env:GITHUB_WORKSPACE\_nsis"

      # `if: always()`: las sumas y la subida NO pueden depender de que el
      # instalador saliera bien. Es el mismo error que ya costó dos intentos —
      # una etapa opcional tumbando la entrega — pero un paso más abajo.
      - name: Sumas SHA256
        if: always()
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist"
          if (-not (Test-Path $dist)) { Write-Host "no hay dist/"; exit 0 }
          $archivos = @(Get-ChildItem $dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' })
          Write-Host "en dist/: $($archivos.Count) archivo(s)"
          foreach ($f in $archivos) { Write-Host ("  {0,-46} {1,8:N1} MB" -f $f.Name, ($f.Length / 1MB)) }
          if ($archivos.Count -eq 0) { Write-Host "nada que firmar"; exit 0 }
          $archivos |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Out-File "$dist\SHA256SUMS.txt" -Encoding utf8
          Get-Content "$dist\SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instalador-windows
          path: dist/
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
