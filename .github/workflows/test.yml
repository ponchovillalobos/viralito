# CI mínimo: tipos + tests + paridad de estilos en cada push/PR.
# La paridad shorts↔largos ya divergió una vez en producción — esto lo impide.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      # Las dependencias de remotion se instalan ANTES de `npm test`, no después.
      #
      # `npm test` de frontend encadena siete verificadores que viven en
      # `remotion/`, y dos de ellos —check-lucide-names y check-icon-coverage—
      # importan `lucide-react`. Node resuelve los paquetes desde la carpeta del
      # módulo que se ejecuta, o sea `remotion/node_modules`: sin instalar, los
      # dos revientan con ERR_MODULE_NOT_FOUND.
      #
      # Con este paso después de `npm test`, CI llevaba ROJO desde el 27 de
      # agosto — doce corridas seguidas — mientras en la máquina de desarrollo
      # todo pasaba, porque ahí `remotion/node_modules` siempre está. Un CI que
      # falla siempre deja de mirarse, y entonces es peor que no tenerlo.
      - name: Instalar dependencias (remotion)
        run: npm ci
        working-directory: remotion

      # Python tambien va ANTES de `npm test`, por la misma razon que remotion.
      #
      # `callouts.test.ts` no es un test de logica: EJECUTA `word_callouts.py`,
      # porque el defecto que cuida no era de logica sino de conexion — el script
      # existia entero y nadie lo invocaba. Sin interprete, la funcion devolvia
      # lista vacia y el test fallaba con "expected [] to deeply equal
      # [ '8', '50%', '3x' ]", sin una palabra sobre Python. Estuvo asi doce
      # corridas.
      #
      # `word_callouts.py` usa solo la biblioteca estandar (argparse, json, re,
      # sys): no hace falta el venv ni instalar nada. Solo un interprete, y se le
      # dice cual con VIRAL_PYTHON_EXE, porque por omision se busca el venv de
      # Windows (python/venv/Scripts/python.exe) que aqui no existe.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tipos (tsc)
        run: npx tsc --noEmit
        working-directory: frontend
      # Los tests y los verificadores van en pasos SEPARADOS.
      #
      # No es cosmético: los logs de Actions exigen permisos de administrador del
      # repositorio, así que quien no los tiene sólo ve "el paso falló". Con un
      # único paso gigante, un CI rojo es adivinanza — y así estuvo doce
      # corridas. Separados, el nombre del paso ya dice dónde mirar.
      #
      # No se duplica la lista: `npm test` = `test:unit` + `check`, los mismos
      # dos comandos que corren acá. Toda lista escrita dos veces se separa
      # (ya pasó con los estilos, los temas y las miniaturas).
      - name: Tests (vitest)
        id: vitest
        run: npm run test:unit
        working-directory: frontend
        env:
          VIRAL_PYTHON_EXE: python

      # Las anotaciones SÍ se leen sin permisos de admin. Si vitest cae, se
      # vuelve a correr pidiendo el informe en JSON y se emite una anotación por
      # test caído, con archivo y mensaje.
      - name: Qué test cayó exactamente
        if: failure() && steps.vitest.outcome == 'failure'
        working-directory: frontend
        env:
          VIRAL_PYTHON_EXE: python
        run: |
          npx vitest run --reporter=json --outputFile=vitest-informe.json || true
          node ../remotion/anotar-fallos-de-vitest.mjs vitest-informe.json

      - name: Verificadores (catalogo, iconos, fuentes, documentacion)
        run: npm run check
        working-directory: frontend
      - name: Tipos remotion (tsc)
        run: npx tsc --noEmit
        working-directory: remotion
      - name: Sintaxis Python (py_compile)
        run: python -m compileall -q -x "venv|__pycache__" python
